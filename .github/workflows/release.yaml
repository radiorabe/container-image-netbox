name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  release-container:
    uses: radiorabe/actions/.github/workflows/release-container.yaml@6373540d4ab86c4ce044b6a67e96aecddf22c7c9 # v0.45.1
    with:
      image: ghcr.io/radiorabe/netbox
      name: netbox
      display-name: RaBe NetBox
      tags: ubuntu rabe netbox
      cosign-image-skip-regexp: quay.io/netboxcommunity/netbox
      cosign-verify: false
  release-mkdocs:
    permissions:
      contents: write # Required to push the gh-pages branch for documentation deployment
    uses: radiorabe/actions/.github/workflows/release-mkdocs.yaml@6373540d4ab86c4ce044b6a67e96aecddf22c7c9 # v0.45.1
  github-actions:
    permissions:
      contents: read
      security-events: write # so zizmor can publish results to the Security tab
    uses: radiorabe/actions/.github/workflows/test-github-actions.yaml@6373540d4ab86c4ce044b6a67e96aecddf22c7c9 # v0.45.1
