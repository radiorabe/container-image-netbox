name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  release-container:
    uses: radiorabe/actions/.github/workflows/release-container.yaml@9d40a934aae300f2fa9a962b8d19e0f093c83a3a # v0.45.2
    with:
      image: ghcr.io/radiorabe/netbox-v3.1.7
      name: netbox-v3.1.7
      display-name: RaBe NetBox
      tags: ubuntu rabe netbox
      # cosign-image-skip-regexp: quay.io/netboxcommunity/netbox
      cosign-verify: false
  release-mkdocs:
    permissions:
      contents: write # Required to push the gh-pages branch for documentation deployment
    uses: radiorabe/actions/.github/workflows/release-mkdocs.yaml@9d40a934aae300f2fa9a962b8d19e0f093c83a3a # v0.45.2
  github-actions:
    permissions:
      contents: read
      security-events: write # so zizmor can publish results to the Security tab
    uses: radiorabe/actions/.github/workflows/test-github-actions.yaml@9d40a934aae300f2fa9a962b8d19e0f093c83a3a # v0.45.2
